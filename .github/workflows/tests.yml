name: Audio QC regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    defaults:
      run:
        working-directory: audio-delivery-qc
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install local measurement and GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libopengl0 libgl1
          python -m pip install -e ".[test,gui]"
      - name: Record runtime
        run: |
          python --version
          ffmpeg -version
          ffprobe -version
          python -m pip freeze
      - name: Run all deterministic and integration tests
        run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: audio-delivery-qc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,gui]" pip-audit
      - name: Verify and inventory installed dependencies
        run: |
          python -m pip check
          # Exclude only this unpublished local project, not its dependencies.
          # --skip-editable still yields a skipped result that --strict rejects.
          python -m pip list --format=freeze --exclude audio-delivery-qc > audit-requirements.txt
      - name: Audit installed dependencies (no automatic upgrades)
        run: python -m pip_audit --strict --no-deps --disable-pip -r audit-requirements.txt
