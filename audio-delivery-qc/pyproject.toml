[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-delivery-qc"
version = "1.0.0"
description = "Offline, read-only technical QC for professional audio deliveries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
gui = ["PySide6>=6.8,<7"]

[project.scripts]
audio-qc = "audio_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: uses local FFmpeg and ffprobe"]
